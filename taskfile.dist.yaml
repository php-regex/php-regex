version: 3

tasks:
  phpcs:
    cmds:
      - cmd: tools/php-cs-fixer/vendor/bin/php-cs-fixer fix --diff -v {{.CLI_ARGS}}
      - cmd: touch .task/phpcs.success
    sources:
      - .php-cs-fixer.dist.php
      - bin/**/*.php
      - src/**/*.php
      - tests/**/*.php
      - benchmarks/**/*.php
    excludes:
      - tests/Fixtures/**/*
    generates:
      - .cache/php-cs-fixer/cache.json
      - .task/phpcs.success
    method: checksum

  phplint:
    cmds:
      - cmd: tools/phplint/vendor/bin/phplint {{.CLI_ARGS}}
      - cmd: touch .task/phplint.success
    sources:
      - .phplint.yml
      - bin/**/*.php
      - src/**/*.php
      - tests/**/*.php
      - benchmarks/**/*.php
    excludes:
      - tests/Fixtures/**/*
    generates:
      - .task/phplint.success
    method: checksum

  phpstan:
    cmds:
      - cmd: tools/phpstan/vendor/bin/phpstan analyse {{.CLI_ARGS}}
      - cmd: touch .task/phpstan.success
    sources:
      - phpstan.dist.neon
      - phpstan-baseline.neon
      - src/PHPStan/extension.neon
      - bin/**/*.php
      - src/**/*.php
      - tests/**/*.php
      - benchmarks/**/*.php
    generates:
      - .cache/phpstan/*
      - .task/phpstan.success
    method: checksum

  rector:
    cmds:
      - cmd: tools/rector/vendor/bin/rector process {{.CLI_ARGS}}
      - cmd: touch .task/rector.success
    sources:
      - rector.php
      - bin/**/*.php
      - src/**/*.php
      - tests/**/*.php
    generates:
      - .task/rector.success
    method: checksum

  cache-version:
    desc: Write RegexParser::CACHE_VERSION from the code that builds an AST
    cmds:
      - cmd: php tests/Tools/update_cache_version.php
    sources:
      - src/Parser/Lexer.php
      - src/Parser/Syntax/TokenParser.php
      - src/Parser/Token/Token.php
      - src/Parser/Token/TokenStream.php
      - src/Parser/Token/TokenType.php
      - src/Parser/Node/**/*.php
      - src/Parser/Internal/**/*.php
      - src/Parser/Validation/Validator.php
      - src/Parser/PcreTarget.php
      - src/Parser/PcreFeature.php
      - src/Parser/Analysis/GroupNumbering*.php
      - tests/Support/AstFingerprint.php
    generates:
      - src/Parser/RegexParser.php
    method: checksum

  phpunit:
    cmds:
      - cmd: php -d phar.readonly=0 tools/phpunit/vendor/bin/phpunit {{.CLI_ARGS}}
      - cmd: touch .task/phpunit.success
    sources:
      - phpunit.xml.dist
      - src/**/*.php
      - tests/**/*.php
    generates:
      - .cache/phpunit/test-results
      - .task/phpunit.success
    method: checksum

  phpbench:
    cmds:
      - cmd: tools/phpbench/vendor/bin/phpbench run tests/Benchmark --report=default {{.CLI_ARGS}}
      - cmd: touch .task/phpbench.success
    sources:
      - phpbench.json
      - phpbench.yml
      - src/**/*.php
      - tests/Benchmark/**/*.php
    generates:
      - .task/phpbench.success
    method: checksum

  infection:
    env:
      # Mutants parse with altered code; keeping their file cache away from
      # the system temp means they can neither read nor poison real entries.
      TMPDIR: '{{.ROOT_DIR}}/.cache/infection-tmp'
    cmds:
      - cmd: mkdir -p .cache/infection-tmp
      # Reports live outside the ".cache" tmpDir: infection wipes that at the
      # end of a run and would take them with it.
      # "-d auto_prepend_file=" neutralizes any ambient prepend shim set in the
      # system php.ini — infection refuses to run with one active.
      - cmd: php -d auto_prepend_file= tools/infection/vendor/bin/infection --logger-text=infection-mutations.log --logger-html=infection-mutations.html {{.CLI_ARGS}}
      - cmd: touch .task/infection.success
    sources:
      - infection.json.dist
      - phpunit.xml.dist
      - tools/infection/composer.lock
      - src/**/*.php
      - tests/**/*.php
    generates:
      - .cache/infection/infection.log
      - .cache/infection/infection-summary.log
      - .cache/infection/infection-report.html
      - .cache/infection/infection-log.json
      - .task/infection.success
    method: checksum

  coverage:
    env:
      XDEBUG_MODE: coverage
    cmds:
      - cmd: tools/phpunit/vendor/bin/phpunit --coverage-html coverage {{.CLI_ARGS}}
      - cmd: touch .task/coverage.success
    sources:
      - phpunit.xml.dist
      - src/**/*.php
      - tests/**/*.php
    generates:
      - coverage
      - .task/phpbench.success
    method: checksum

  phar:
    cmds:
      - cmd: phar/build

  lint:
    deps:
      - install
    cmds:
      - task: rector
      - task: phpcs
      - task: cache-version
      - task: phplint
      - task: phpunit
      - task: phpstan

  install:
    cmds:
      - composer install
      - composer install -d tools/php-cs-fixer
      - composer install -d tools/phpbench
      - composer install -d tools/phplint
      - composer install -d tools/phpstan
      - composer install -d tools/rector
      - composer install -d tools/infection
      - composer install -d tools/phpunit

      - task: link
    sources:
      - ./composer.json
      - ./composer.lock
      - ./tools/**/composer.json
      - ./tools/**/composer.lock
    generates:
      - ./vendor/autoload.php
      - ./tools/**/vendor/autoload.php

  update:
    cmds:
      - composer update -W
      - composer outdated --direct
      - composer audit || true

      - composer update -W -d tools/php-cs-fixer
      - composer outdated --direct -d tools/php-cs-fixer
      - composer audit -d tools/php-cs-fixer || true

      - composer update -W -d tools/phpbench
      - composer outdated --direct -d tools/phpbench
      - composer audit -d tools/phpbench || true

      - composer update -W -d tools/phplint
      - composer outdated --direct -d tools/phplint
      - composer audit -d tools/phplint || true

      - composer update -W -d tools/phpstan
      - composer outdated --direct -d tools/phpstan
      - composer audit -d tools/phpstan || true

      - composer update -W -d tools/rector
      - composer outdated --direct -d tools/rector
      - composer audit -d tools/rector || true

      - composer update -W -d tools/infection
      - composer outdated --direct -d tools/infection
      - composer audit -d tools/infection || true

      - composer update -W -d tools/phpunit
      - composer outdated --direct -d tools/phpunit
      - composer audit -d tools/phpunit || true

      - task: link

  corpus:
    desc: Refresh the corpus checkouts, then re-lint them into var/log/corpus.log
    cmds:
      - php bin/corpus update
      - php bin/regex lint corpus/ --output=var/log/corpus.log

  link:
    cmds:
      - mkdir -p ./vendor/bin
      - ln -sf ../../tools/php-cs-fixer/vendor/bin/php-cs-fixer ./vendor/bin/php-cs-fixer
      - ln -sf ../tools/php-cs-fixer/vendor/bin/php-cs-fixer ./bin/php-cs-fixer
      - ln -sf ../tools/php-cs-fixer/vendor/bin/php-cs-fixer ./bin/phpcs

      - ln -sf ../../tools/phpbench/vendor/bin/phpbench ./vendor/bin/phpbench
      - ln -sf ../tools/phpbench/vendor/bin/phpbench ./bin/phpbench

      - ln -sf ../../tools/phplint/vendor/bin/phplint ./vendor/bin/phplint
      - ln -sf ../tools/phplint/vendor/bin/phplint ./bin/phplint

      - ln -sf ../../tools/phpstan/vendor/bin/phpstan ./vendor/bin/phpstan
      - ln -sf ../tools/phpstan/vendor/bin/phpstan ./bin/phpstan

      - ln -sf ../../tools/rector/vendor/bin/rector ./vendor/bin/rector
      - ln -sf ../tools/rector/vendor/bin/rector ./bin/rector

      - ln -sf ../../tools/infection/vendor/bin/infection ./vendor/bin/infection
      - ln -sf ../tools/infection/vendor/bin/infection ./bin/infection

      - ln -sf ../../tools/phpunit/vendor/bin/phpunit ./vendor/bin/phpunit
      - ln -sf ../tools/phpunit/vendor/bin/phpunit ./bin/phpunit
