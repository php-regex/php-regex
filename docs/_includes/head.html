<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | strip_html }} — {% endif %}PHPRegex</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | strip_html }} — {% endif %}PHPRegex">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PHPRegex">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/social.png' | absolute_url }}?v={{ site.time | date: '%s' }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="512x512">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#F8F7F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1B2E" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/main.css?v={{ site.time | date: '%s' }}">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-var.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/jetbrains-mono-var.woff2" crossorigin>
  {% if jekyll.environment == 'production' %}
  <!-- Analytics -->
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QSYBM5HXPS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QSYBM5HXPS');
  </script>
  {% endif %}
</head>
