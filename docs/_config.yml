title: PHPRegex
description: "Static analysis, linter & logic solver for PHP regular expressions."
url: https://php-regex.com

# Keep every existing docs URL in its directory form (/guides/cli/), the
# style GitHub Pages serves; plain Jekyll 3 would emit .html URLs instead.
permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-titles-from-headings
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-feed

# Articles: dated, in-depth pieces under /blog/<slug>/. The permalink stays
# dateless on purpose — a retitled article keeps its URL, and the citations
# and corpora that quote it keep working; the date lives in the front
# matter and reaches the feed, the sitemap and the article markup instead.
collections:
  articles:
    output: true
    permalink: /blog/:title/

feed:
  collections:
    - articles

# A collection document otherwise gets its title inferred from the filename
# and titleized ("which-pcre2..." -> "Which Pcre2..."); the H1 is the real
# title, as it already is for every page of the site.
titles_from_headings:
  collections: true

# Same opt-in for the articles' relative links: without it the plugin
# rewrites .md links on pages only, and an article would ship raw
# "sibling.md" hrefs that 404 from /blog/<slug>/.
relative_links:
  collections: true

kramdown:
  input: GFM

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  # The tutorial track navigates within itself: sidebar, pager and
  # breadcrumb read nav-tutorial.yml, not the global nav.
  - scope:
      path: "tutorial"
      type: pages
    values:
      layout: tutorial
  # Articles carry their own layout: a byline, the TechArticle schema and
  # the article Open Graph type, over the same chrome as every other page.
  - scope:
      path: ""
      type: articles
    values:
      layout: article
