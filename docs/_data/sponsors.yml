    what: the Infection integration
    packages: [regex-infection]
    pages: [/guides/infection/]
    sponsor:

  - id: laravel
    title: Laravel integration
    what: the Laravel integration
    packages: [regex-laravel]
    pages: [/guides/laravel/]
    sponsor:

  - id: symfony
    title: Symfony integration
    what: the Symfony integration
