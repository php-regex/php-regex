# The sponsor frame at the foot of every documentation page, and the
# lists BACKERS.md mirrors.
#
# `sponsors` are the companies (the $150 and $400 monthly tiers, and the
# $300 one-time tier for three months). While the list is empty the frame
# shows the open slot: an empty named group waiting for a logo.
#
#   sponsors:
#     - name: Acme
#       url: https://acme.example
#       logo: /assets/img/sponsors/acme.svg            # light paper
#       logo_dark: /assets/img/sponsors/acme-dark.svg  # optional, dark paper
#       featured: true                                 # the $400 tier: first, larger
#
# `backers` are the developers (the $15 monthly tier). Avatars are served
# from this site, never hot-linked: save the GitHub avatar as
# /assets/img/backers/<login>.png. Without an avatar the row draws the
# backer's initial.
#
#   backers:
#     - name: Jane Doe
#       login: janedoe
#       avatar: /assets/img/backers/janedoe.png
#
# A page opts out of the frame with `sponsor: false` in its front matter.

