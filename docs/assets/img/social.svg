<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title">
  <title id="title">PHPRegex: See a PHP regex as a tree</title>
  <rect width="1280" height="640" fill="#F8F7F2"/>
  <g aria-hidden="true" fill="none" stroke="#A84A08" stroke-opacity=".08" stroke-width="24" stroke-linecap="round">
    <path d="M70 570V392"/>
    <path d="M70 446h112"/>
    <path d="M70 518h186"/>
    <path d="M70 570h112"/>
  </g>
  <g aria-hidden="true" fill="#A84A08" fill-opacity=".08">
    <circle cx="70" cy="370" r="28"/>
    <circle cx="210" cy="446" r="22"/>
    <circle cx="284" cy="518" r="22"/>
    <circle cx="210" cy="570" r="22"/>
  </g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="98" fill="#46586E" font-size="27" font-weight="700" letter-spacing="8">PHPREGEX</text>
    <text x="76" y="205" fill="#182B45" font-size="68" font-weight="800">See a PHP regex</text>
    <text x="76" y="280" fill="#182B45" font-size="68" font-weight="800">as a tree.</text>
    <rect x="80" y="324" width="340" height="6" fill="#A84A08"/>
    <text x="80" y="387" fill="#46586E" font-size="28" font-weight="500">Lexer · Parser · Immutable AST</text>
    <text x="80" y="429" fill="#46586E" font-size="28" font-weight="500">Validation · Capture shapes · Verdicts</text>
    <text x="80" y="570" fill="#46586E" font-size="24" font-weight="600">PHP 8.2+ · MIT · PCRE2-aware</text>
  </g>
  <g>
    <rect x="620" y="82" width="580" height="476" fill="#EFEDE4" stroke="#64748B" stroke-width="2"/>
    <rect x="620" y="82" width="580" height="50" fill="#EFEDE4" stroke="#64748B" stroke-width="2"/>
    <circle cx="652" cy="107" r="8" fill="#A84A08"/>
    <circle cx="682" cy="107" r="8" fill="#46586E"/>
    <circle cx="712" cy="107" r="8" fill="#182B45"/>
    <text x="750" y="117" fill="#46586E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700">AST</text>
    <g fill="#22344E" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="25">
      <text x="656" y="188">Regex</text>
      <text x="680" y="225">└─ Sequence</text>
      <text x="710" y="262">├─ Anchor (^)</text>
      <text x="710" y="299">├─ Group (named) name=&quot;date&quot;</text>
      <text x="744" y="336">└─ Quantifier ({4}, greedy)</text>
      <text x="778" y="373">└─ CharType (\d)</text>
      <text x="710" y="410">├─ Literal ('-')</text>
      <text x="710" y="447">├─ Quantifier ({2}, greedy)</text>
      <text x="710" y="484">└─ Anchor ($)</text>
    </g>
  </g>
</svg>
