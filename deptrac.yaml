deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Test\.php$#'
  layers:
    - name: Parser
      collectors:
        - type: classLike
          value: '^PHPRegex\\Parser\\'
    - name: Explain
      collectors:
        - type: classLike
          value: '^PHPRegex\\Explain\\'
    - name: Optimizer
      collectors:
        - type: classLike
          value: '^PHPRegex\\Optimizer\\'
    - name: Generator
      collectors:
        - type: classLike
          value: '^PHPRegex\\Generator\\'
    - name: Automata
      collectors:
        - type: classLike
          value: '^PHPRegex\\Automata\\'
    - name: ReDoS
      collectors:
        - type: classLike
          value: '^PHPRegex\\Redos\\'
    - name: Transpiler
      collectors:
        - type: classLike
          value: '^PHPRegex\\Transpiler\\'
    - name: Linter
      collectors:
        - type: classLike
          value: '^PHPRegex\\Linter\\'
    - name: Toolkit
      collectors:
        - type: classLike
          value: '^PHPRegex\\Toolkit\\'
    - name: Cli
      collectors:
        - type: classLike
          value: '^PHPRegex\\Cli\\'
    - name: LanguageServer
      collectors:
        - type: classLike
          value: '^PHPRegex\\LanguageServer\\'
    - name: PHPStan
      collectors:
        - type: classLike
          value: '^PHPRegex\\PHPStan\\'
    - name: Psalm
      collectors:
        - type: classLike
          value: '^PHPRegex\\Psalm\\'
    - name: Rector
      collectors:
        - type: classLike
          value: '^PHPRegex\\Rector\\'
    - name: Symfony
      collectors:
        - type: classLike
          value: '^PHPRegex\\Symfony\\'
    - name: Laravel
      collectors:
        - type: classLike
          value: '^PHPRegex\\Laravel\\'
  ruleset:
    Parser: ~
    Explain: [Parser]
    Optimizer: [Parser, Automata, ReDoS]
    Generator: [Parser]
    Automata: [Parser]
    ReDoS: [Parser]
    Transpiler: [Parser]
    Linter: [Parser, Explain, ReDoS, Automata, Optimizer]
    Toolkit: [Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
    Cli: [Toolkit, Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
    LanguageServer: [Toolkit, Parser, Explain, Optimizer, Linter]
    PHPStan: [Parser, Linter, ReDoS, Automata, Optimizer]
    Psalm: [Parser]
    Rector: [Parser, Automata]
    Symfony: [Toolkit, Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
    Laravel: [Toolkit, Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
