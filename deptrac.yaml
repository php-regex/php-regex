deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Test\.php$#'
  layers:
    - name: Parser
      collectors:
        - type: classLike
          value: '^PhpRegex\\Parser\\'
    - name: Explain
      collectors:
        - type: classLike
          value: '^PhpRegex\\Explain\\'
    - name: Optimizer
      collectors:
        - type: classLike
          value: '^PhpRegex\\Optimizer\\'
    - name: Generator
      collectors:
        - type: classLike
          value: '^PhpRegex\\Generator\\'
    - name: Automata
      collectors:
        - type: classLike
          value: '^PhpRegex\\Automata\\'
    - name: ReDoS
      collectors:
        - type: classLike
          value: '^PhpRegex\\Redos\\'
    - name: Transpiler
      collectors:
        - type: classLike
          value: '^PhpRegex\\Transpiler\\'
    - name: Linter
      collectors:
        - type: classLike
          value: '^PhpRegex\\Linter\\'
    - name: Toolkit
      collectors:
        - type: classLike
          value: '^PhpRegex\\Toolkit\\'
    - name: Cli
      collectors:
        - type: classLike
          value: '^PhpRegex\\Cli\\'
    - name: LanguageServer
      collectors:
        - type: classLike
          value: '^PhpRegex\\LanguageServer\\'
    - name: PHPStan
      collectors:
        - type: classLike
          value: '^PhpRegex\\PHPStan\\'
    - name: Symfony
      collectors:
        - type: classLike
          value: '^PhpRegex\\Symfony\\'
    - name: Laravel
      collectors:
        - type: classLike
          value: '^PhpRegex\\Laravel\\'
  ruleset:
    Parser: ~
    Explain: [Parser]
    Optimizer: [Parser, Automata]
    Generator: [Parser]
    Automata: [Parser]
    ReDoS: [Parser]
    Transpiler: [Parser]
    Linter: [Parser, Explain, ReDoS, Automata, Optimizer]
    Toolkit: [Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
    Cli: [Toolkit, Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
    LanguageServer: [Toolkit, Parser, Explain, Optimizer, Linter]
    PHPStan: [Parser, Linter, ReDoS, Automata, Optimizer]
    Symfony: [Toolkit, Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
    Laravel: [Toolkit, Parser, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, Linter]
