deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Test\.php$#'
  layers:
    - name: Parser
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Parser\\#'
          must_not:
            - type: tagValueRegex
              tag: '@internal'
    - name: ParserInternal
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Parser\\#'
            - type: tagValueRegex
              tag: '@internal'
    - name: Explain
      collectors:
        - type: classLike
          value: '^PHPRegex\\Explain\\'
    - name: Optimizer
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Optimizer\\#'
          must_not:
            - type: tagValueRegex
              tag: '@internal'
    - name: OptimizerInternal
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Optimizer\\#'
            - type: tagValueRegex
              tag: '@internal'
    - name: Generator
      collectors:
        - type: classLike
          value: '^PHPRegex\\Generator\\'
    - name: Automata
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Automata\\#'
          must_not:
            - type: tagValueRegex
              tag: '@internal'
    - name: AutomataInternal
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Automata\\#'
            - type: tagValueRegex
              tag: '@internal'
    - name: ReDoS
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Redos\\#'
          must_not:
            - type: tagValueRegex
              tag: '@internal'
    - name: RedosInternal
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Redos\\#'
            - type: tagValueRegex
              tag: '@internal'
    - name: Transpiler
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Transpiler\\#'
          must_not:
            - type: tagValueRegex
              tag: '@internal'
    - name: TranspilerInternal
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Transpiler\\#'
            - type: tagValueRegex
              tag: '@internal'
    - name: Linter
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Linter\\#'
          must_not:
            - type: tagValueRegex
              tag: '@internal'
    - name: LinterInternal
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\Linter\\#'
            - type: tagValueRegex
              tag: '@internal'
    - name: Toolkit
      collectors:
        - type: classLike
          value: '^PHPRegex\\Toolkit\\'
    - name: Cli
      collectors:
        - type: classLike
          value: '^PHPRegex\\Cli\\'
    - name: LanguageServer
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\LanguageServer\\#'
          must_not:
            - type: tagValueRegex
              tag: '@internal'
    - name: LanguageServerInternal
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^PHPRegex\\LanguageServer\\#'
            - type: tagValueRegex
              tag: '@internal'
    - name: PHPStan
      collectors:
        - type: classLike
          value: '^PHPRegex\\PHPStan\\'
    - name: PHPUnit
      collectors:
        - type: classLike
          value: '^PHPRegex\\PHPUnit\\'
    - name: Psalm
      collectors:
        - type: classLike
          value: '^PHPRegex\\Psalm\\'
    - name: Rector
      collectors:
        - type: classLike
          value: '^PHPRegex\\Rector\\'
    - name: Symfony
      collectors:
        - type: classLike
          value: '^PHPRegex\\Symfony\\'
    - name: Laravel
      collectors:
        - type: classLike
          value: '^PHPRegex\\Laravel\\'
  ruleset:
    Parser: [ParserInternal]
    ParserInternal: [Parser]
    Explain: [Parser, ParserInternal]
    Optimizer: [Parser, ParserInternal, Automata, ReDoS, OptimizerInternal]
    OptimizerInternal: [Optimizer, Parser, ParserInternal, Automata, ReDoS]
    Generator: [Parser, ParserInternal]
    Automata: [Parser, ParserInternal, AutomataInternal]
    AutomataInternal: [Automata, Parser, ParserInternal]
    ReDoS: [Parser, ParserInternal, RedosInternal]
    RedosInternal: [ReDoS, Parser, ParserInternal]
    Transpiler: [Parser, ParserInternal, TranspilerInternal]
    TranspilerInternal: [Transpiler, Parser, ParserInternal]
    Linter: [Parser, ParserInternal, Explain, ReDoS, Automata, Optimizer, OptimizerInternal, LinterInternal]
    LinterInternal: [Linter, Parser, ParserInternal, Explain, ReDoS, Automata, Optimizer, OptimizerInternal]
    Toolkit: [Parser, ParserInternal, Explain, Optimizer, Generator, ReDoS, Transpiler, Linter]
    # The language server is started by its class name, when its package is installed.
    Cli: [Toolkit, Parser, ParserInternal, Explain, Optimizer, Generator, Automata, AutomataInternal, ReDoS, RedosInternal, Transpiler, TranspilerInternal, Linter, LinterInternal, LanguageServerInternal]
    LanguageServer: [Toolkit, Parser, ParserInternal, Explain, Optimizer, ReDoS, Linter, LinterInternal, LanguageServerInternal]
    LanguageServerInternal: [LanguageServer, Toolkit, Parser, ParserInternal, Explain, Optimizer, ReDoS, Linter, LinterInternal]
    PHPStan: [Parser, ParserInternal, Linter, LinterInternal, ReDoS, Automata, Optimizer]
    PHPUnit: [Toolkit, Parser, ReDoS]
    Psalm: [Parser, ParserInternal, Automata, Linter, LinterInternal]
    Rector: [Parser, Automata]
    Symfony: [Toolkit, Parser, ParserInternal, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, TranspilerInternal, Linter, LinterInternal]
    Laravel: [Toolkit, Parser, ParserInternal, Explain, Optimizer, Generator, Automata, ReDoS, Transpiler, TranspilerInternal, Linter, LinterInternal]
