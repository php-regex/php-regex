name: Stop the pull request's runs
description: >
  Cancels every run of the pull request's head commit that has not finished,
  this one last, once a job has failed: the author fixes the failure and
  pushes again, and the runners go to the other pull requests meanwhile.
  A pull request from a fork has a read-only token: its runs are left alone.

runs:
  using: composite
  steps:
    - name: Cancel the runs of the head commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        JOB: ${{ github.job }}
      run: |
        echo "::error::${JOB} failed: the other runs of this pull request are cancelled."

        if ! runs=$(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id'); then
          echo "::warning::The runs of ${HEAD_SHA} could not be listed: they go on."
          exit 0
        fi

        for run in ${runs}; do
          if [ "${run}" != "${RUN_ID}" ]; then
            gh api --method POST "repos/${REPOSITORY}/actions/runs/${run}/cancel" > /dev/null \
              || echo "::warning::Run ${run} could not be cancelled."
          fi
        done

        gh api --method POST "repos/${REPOSITORY}/actions/runs/${RUN_ID}/cancel" > /dev/null \
          || echo "::warning::This run could not be cancelled."
