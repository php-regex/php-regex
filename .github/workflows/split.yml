name: Split

# Pushes each src/<Package> to its read-only repository on every push to 2.x
# and on every tag, and .github/organization to php-regex/.github. Off until the repository
# variable SPLIT_ENABLED is "true" and the secret SPLIT_TOKEN holds a token
# with write access to the php-regex/regex-* repositories and
# php-regex/.github.

on:
  push:
    branches: ['2.x']
    tags: ['v2.*']

permissions:
  contents: read

# One group for every run, whatever ref started it: a branch run and a tag
# run push to the same repositories, so each waits for the one before. A
# run already waiting is replaced by GitHub when another starts: re-run a
# tag run cancelled that way.
concurrency:
  group: split
  cancel-in-progress: false

jobs:
  split:
    name: Split the packages
    if: vars.SPLIT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install splitsh-lite
        # The release archive, checked against the checksum pinned here
        # before anything of it runs: it runs with the token in reach.
        env:
          VERSION: '1.0.1'
          SHA256: 2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc
        run: |
          mkdir -p "$RUNNER_TEMP/splitsh"
          archive="$RUNNER_TEMP/lite_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/splitsh/lite/releases/download/v${VERSION}/lite_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/splitsh" ./splitsh-lite
          echo "$RUNNER_TEMP/splitsh" >> "$GITHUB_PATH"

      - name: Split and push
        env:
          SPLIT_REMOTE_BASE: https://x-access-token:${{ secrets.SPLIT_TOKEN }}@github.com/php-regex
        run: |
          git fetch --tags --quiet
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bin/split --branch 2.x --tag "${GITHUB_REF_NAME}"
          else
            bin/split --branch "${GITHUB_REF_NAME}"
          fi
