name: Docs links

on:
  pull_request:
    branches: [ 2.x ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-links.yml'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          # The Ruby of docs/.ruby-version and the gems of docs/Gemfile.lock,
          # installed once and cached between runs.
          working-directory: docs
          bundler-cache: true
      - name: Build the docs site
        working-directory: docs
        run: bundle exec jekyll build
      - name: Check every external link
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, sys
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import unquote, urlsplit

          urls = set()
          for page in glob.glob('docs/_site/**/*.html', recursive=True):
              for match in re.finditer(r'(?:href|src)="(https?://[^"]+)"', open(page).read()):
                  urls.add(match.group(1))

          # The site's own address: those links are read in the site just
          # built, where a page a pull request adds already exists.
          site = re.search(r'^url:\s*(\S+)', open('docs/_config.yml').read(), re.M).group(1)
          own_host = urlsplit(site).netloc

          # Hosts that answer 403/429 to scripts but serve browsers fine.
          tolerated = ('www.npmjs.com', 'docs.sonarsource.com', 'github.com')

          def built(path):
              path = unquote(path).lstrip('/')
              candidates = [path, os.path.join(path, 'index.html'), path + '.html']
              return any(os.path.isfile(os.path.join('docs/_site', candidate)) for candidate in candidates)

          def status_of(url):
              parts = urlsplit(url)
              if parts.netloc == own_host:
                  return '200' if built(parts.path) else '404'
              status = ''
              for extra_args in (['-I'], ['-L']):
                  result = subprocess.run(
                      ['curl', '--max-time', '20', '--retry', '2', '--retry-delay', '2',
                       '-sS', '-o', '/dev/null', '-w', '%{http_code}',
                       '-A', 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'] + extra_args + [url],
                      capture_output=True, text=True)
                  status = result.stdout.strip()
                  if status.startswith(('2', '3')):
                      break
              return status

          ordered = sorted(urls)
          with ThreadPoolExecutor(max_workers=16) as pool:
              statuses = list(pool.map(status_of, ordered))

          dead = []
          for url, status in zip(ordered, statuses):
              if status.startswith(('2', '3')):
                  continue
              if status in ('403', '429') and any(host in url for host in tolerated):
                  continue
              dead.append((status or 'no-answer', url))

          for status, url in dead:
              print(f'{status}  {url}')
          print(f'{len(urls)} external links checked, {len(dead)} dead')
          sys.exit(1 if dead else 0)
          PY
