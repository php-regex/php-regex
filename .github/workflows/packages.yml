name: Packages

# Each of the nineteen packages as Packagist will serve it, out of the
# monorepo.

on:
  # A pull request starts ci.yml, which calls this workflow in its stage.
  workflow_call:
  schedule:
    # Every Monday, against the week's releases, which no lock file pins.
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event in the key: a scheduled run on 2.x neither cancels a manual
  # run nor is cancelled by one. The name is written out: called from
  # ci.yml, github.workflow is the caller's, and the group would be the
  # caller's own.
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    # The root manifest and the nineteen package manifests, strictly: a
    # warning Packagist would show, an unbound requirement or a schema
    # mistake fails here, before a tag publishes it. No lock file is
    # committed, so none is checked.
    name: Validate the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.4'
          dependencies: none

      - name: Validate every manifest
        run: |
          status=0
          for manifest in composer.json src/*/composer.json; do
            composer validate --strict --no-interaction --no-check-lock "$manifest" || status=1
          done
          exit "$status"
      # One class under one name across the nineteen packages: two files
      # declaring the same class, between which an optimized autoloader
      # would pick silently, fail here.
      - name: Check no class is declared twice
        run: composer dump-autoload --optimize --strict-ambiguous --no-interaction

  standalone:
    # Each package as Packagist serves it: its directory alone, required in a
    # bare project, its php-regex siblings reached through path repositories
    # at the branch's version. A requirement the monorepo's root composer.json
    # hides, a sibling missing from its require or an autoload path that
    # leaves the package directory fails here, before a tag publishes it.
    name: Install ${{ matrix.package }} alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Six of the nineteen packages at once: the jobs of fifteen seconds
      # each start beside the reference and the coverage, and the second
      # stage of one pull request holds a third of the runners at most.
      max-parallel: 6
      matrix:
        package: [ Parser, Explain, Optimizer, Generator, Automata, Redos, Transpiler, Linter, Toolkit, Cli, LanguageServer, Mcp, PHPStan, PHPUnit, Infection, Psalm, Rector, Symfony, Laravel ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.4'
          dependencies: none
          tools: dep-analyser

      - name: Install the package in a bare project
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          project="$(mktemp -d)"
          # shellcheck disable=SC2016 # the single quotes hold PHP, not shell
          php -r '
              $repositories = [];
              foreach (glob("src/*/composer.json") as $manifest) {
                  $repositories[] = ["type" => "path", "url" => realpath(dirname($manifest)), "options" => ["symlink" => false, "versions" => [json_decode(file_get_contents($manifest), true)["name"] => "2.x-dev"]]];
              }
              $name = json_decode(file_get_contents("src/".$argv[1]."/composer.json"), true)["name"];
              file_put_contents($argv[2]."/composer.json", json_encode(["repositories" => $repositories, "require" => [$name => "2.x-dev"], "minimum-stability" => "dev", "prefer-stable" => true], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          ' "$PACKAGE" "$project"
          composer install -d "$project" --no-interaction --no-progress
          echo "project=$project" >> "$GITHUB_ENV"

      # The root requires no package for an audit to read: the advisories
      # are read here, against what a consumer of this package installs.
      - name: Audit what it installed
        run: composer audit -d "$project" --no-interaction

      # A class of the package's own, loaded from its installed copy and run
      # once, then its binaries: a sibling's class would pass whatever this
      # package ships.
      - name: Run a class of the package from what it installed
        env:
          PACKAGE: ${{ matrix.package }}
        run: php tests/Tools/package_smoke_check.php "$PACKAGE" "$project"

      # What the installed sources reach must be in the manifest's require,
      # or among what it suggests: a class, a function or an extension
      # reached through a dependency's own dependency fails here.
      - name: Check the manifest declares what the package uses
        env:
          PACKAGE: ${{ matrix.package }}
        run: php tests/Tools/package_dependency_check.php "$PACKAGE" "$project"

  phpunit-matrix:
    # The assertion package runs on five PHPUnit majors the monorepo suite
    # never runs together: each cell installs it alone, with the cell's
    # PHPUnit, in a bare project, and asks the four assertions to answer
    # and to fail — a failing assertion that stops failing, or a passing
    # one that starts failing, is what this job is here to catch.
    name: PHPUnit bridge (PHPUnit ${{ matrix.phpunit }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { phpunit: '^9.6', php: '8.1' }
          - { phpunit: '^10.0', php: '8.1' }
          - { phpunit: '^11.0', php: '8.2' }
          - { phpunit: '^12.0', php: '8.3' }
          - { phpunit: '^13.0', php: '8.4' }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: ./.github/actions/setup-php-project
        with:
          php-version: ${{ matrix.php }}
          dependencies: none

      - name: Install the package in a bare project
        env:
          PHPUNIT: ${{ matrix.phpunit }}
        run: |
          project="$(mktemp -d)"
          # shellcheck disable=SC2016 # the single quotes hold PHP, not shell
          php -r '
              $repositories = [];
              foreach (glob("src/*/composer.json") as $manifest) {
                  $repositories[] = ["type" => "path", "url" => realpath(dirname($manifest)), "options" => ["symlink" => false, "versions" => [json_decode(file_get_contents($manifest), true)["name"] => "2.x-dev"]]];
              }
              file_put_contents($argv[2]."/composer.json", json_encode(["repositories" => $repositories, "require" => ["php-regex/regex-phpunit" => "2.x-dev", "phpunit/phpunit" => $argv[1]], "minimum-stability" => "dev", "prefer-stable" => true], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          ' "$PHPUNIT" "$project"
          composer install -d "$project" --no-interaction --no-progress
          echo "project=$project" >> "$GITHUB_ENV"

      - name: Check the four assertions answer and fail
        run: php tests/Tools/phpunit_bridge_selfcheck.php "$project"

  infection-e2e:
    # The mutators run by Infection itself, as a user runs them: installed
    # through Composer, and as the PHAR, which exposes only the mutator
    # interface and leaves the project's copy of it unloaded. Each cell
    # installs the package alone in a bare project, runs Infection twice on a
    # small suite and reads its log: only the six mutators, some mutants
    # killed and some escaped, each escaped one with its kill string, the
    # same mutants on both runs.
    name: Infection mutators (${{ matrix.mode }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [ composer, phar ]
        php: [ '8.3', '8.4' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: ./.github/actions/setup-php-project
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          dependencies: none

      - name: Install the package in a bare project
        env:
          MODE: ${{ matrix.mode }}
        run: |
          project="$(mktemp -d)"
          # shellcheck disable=SC2016 # the single quotes hold PHP, not shell
          php -r '
              $repositories = [];
              foreach (glob("src/*/composer.json") as $manifest) {
                  $repositories[] = ["type" => "path", "url" => realpath(dirname($manifest)), "options" => ["symlink" => false, "versions" => [json_decode(file_get_contents($manifest), true)["name"] => "2.x-dev"]]];
              }
              $require = ["php-regex/regex-infection" => "2.x-dev", "phpunit/phpunit" => "^12.0"];
              if ("composer" === $argv[1]) {
                  $require["infection/infection"] = "^0.35";
              }
              file_put_contents($argv[2]."/composer.json", json_encode(["repositories" => $repositories, "require-dev" => $require, "autoload" => ["psr-4" => ["Fixture\\" => "src/"]], "autoload-dev" => ["psr-4" => ["Fixture\\Tests\\" => "tests/"]], "minimum-stability" => "dev", "prefer-stable" => true, "config" => ["allow-plugins" => ["infection/extension-installer" => true]]], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          ' "$MODE" "$project"
          composer install -d "$project" --no-interaction --no-progress
          echo "project=$project" >> "$GITHUB_ENV"

      - name: Download the Infection PHAR
        if: matrix.mode == 'phar'
        run: |
          curl -fsSL --retry 5 -o "$project/infection.phar" https://github.com/infection/infection/releases/download/0.35.9/infection.phar
          echo "c9b332af194380b2043eb6e309b308653f221073f41825b54e862fbef606a094  $project/infection.phar" | sha256sum --check
          echo "infection=$project/infection.phar" >> "$GITHUB_ENV"

      - name: Locate the Composer-installed Infection
        if: matrix.mode == 'composer'
        run: echo "infection=$project/vendor/bin/infection" >> "$GITHUB_ENV"

      - name: Run Infection with the six mutators
        run: php tests/Tools/infection_bridge_selfcheck.php "$project" "$infection"

  phar:
    # The release path on every pull request: the phar built as the tag workflow
    # builds it, then run on the lowest PHP the packages admit, as the tag
    # workflow runs it, so that a release never meets a broken build first.
    # The branch's phar stays seven days as an artifact of the run.
    name: Build and run the phar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Box needs PHP 8.2 to build the phar.
      - name: Setup PHP to build
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, tokenizer, fileinfo
          ini-values: phar.readonly=0
          coverage: none
          tools: composer

      # The release's phar, checked against the checksum pinned here before
      # it builds anything. Asked for Box, setup-php downloads the latest
      # release, and once: a 504 from GitHub then fails the build. Dependabot
      # reads no such pin: a new Box is taken by hand, its VERSION and SHA256
      # together, here and in the other phar build alike.
      - name: Install Box
        env:
          VERSION: '4.7.1'
          SHA256: aedabb38bad96a90868603f118956c3faa662b545c06be66df1b145aba703c0a
        run: |
          mkdir -p "$RUNNER_TEMP/box"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/box/box" "https://github.com/box-project/box/releases/download/${VERSION}/box.phar"
          echo "$SHA256  $RUNNER_TEMP/box/box" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/box/box"
          echo "$RUNNER_TEMP/box" >> "$GITHUB_PATH"

      - name: Build
        run: phar/build

      # The version the sources declare, which the phar reports.
      - name: Read the version of the sources
        id: version
        run: |
          version=$(sed -nE "s/^[[:space:]]*public const VERSION = '([^']+)';/\1/p" src/Toolkit/Regex.php)
          if [ -z "$version" ]; then
            echo "No Regex::VERSION in src/Toolkit/Regex.php." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup the lowest PHP the phar runs on
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: mbstring, tokenizer, fileinfo
          coverage: none

      - name: Check the phar
        uses: ./.github/actions/check-phar
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Keep the phar
        uses: actions/upload-artifact@v7
        with:
          name: regex.phar
          path: bin/regex.phar
          retention-days: 7
