name: Demo applications

# Installs the checkout itself, through the path repository each demo
# application reads, into a Symfony and a Laravel application and runs their
# tests. It runs on every push to 2.x, as bin/release wants a run on the
# commit it tags, and on a pull request that changes what the applications
# install.

on:
  push:
    branches: [2.x]
  pull_request:
    branches: [2.x]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'composer.json'
      - '.github/workflows/demo.yml'
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event in the key: a scheduled run on 2.x neither cancels a push's
  # run nor is cancelled by one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 8.5 is the ceiling of the Laravel lock (nette packages stop there)
      # and above the Symfony lock floor (8.4.1); 8.6 would need
      # --ignore-platform-req=php+, as .github/actions/setup-php-project passes.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pcre, tokenizer, xml
          coverage: none

      - name: Install the Symfony application
        run: composer install -d demo/symfony --no-interaction --no-progress

      - name: Install the Laravel application
        run: composer install -d demo/laravel --no-interaction --no-progress

      - name: Warm the Symfony cache
        run: php demo/symfony/bin/console cache:warmup

      - name: Run the Symfony application tests
        working-directory: demo/symfony
        run: vendor/bin/phpunit

      - name: Prepare the Laravel environment
        run: |
          cp demo/laravel/.env.example demo/laravel/.env
          php demo/laravel/artisan key:generate

      - name: Run the Laravel application tests
        working-directory: demo/laravel
        run: vendor/bin/phpunit
