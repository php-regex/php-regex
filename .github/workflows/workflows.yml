name: Workflows

# The workflows and the local actions under .github/, the action at the root
# of the repository, and the workflow each package carries for its read-only
# repository: actionlint for their syntax,
# expressions and shell scripts, zizmor for their security. They run on every
# push to 2.x, as bin/release wants a run on the commit it tags, on a pull
# request that changes one of them (the community files under .github/ are
# not one), and every Monday, when a new finding may name old code.

on:
  pull_request:
    branches: [ 2.x ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - 'src/*/.github/**'
      - 'action.yml'
  schedule:
    - cron: '7 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event in the key: a scheduled run on 2.x neither cancels a manual
  # run nor is cancelled by one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        # The release archive, checked against its published checksum; the
        # runner's shellcheck reads the run: scripts.
        env:
          VERSION: '1.7.12'
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Run actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml src/*/.github/workflows/*.yml

      # actionlint reads workflows alone, and zizmor only warns on a file it
      # cannot read: the runner's yq fails on an action that does not parse
      # or is no composite one.
      - name: Read the action at the root
        run: yq --exit-status '.runs.using == "composite"' action.yml

      - name: Stop the pull request's other runs
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-pull-request-runs

  zizmor:
    name: zizmor
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        # .github/zizmor.yml holds the pinning policy. The findings go to the
        # log and the run's annotations, not to code scanning: no write
        # permission is granted.
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: '1.31.1'
          inputs: .github src/*/.github action.yml
          advanced-security: false
          annotations: true

      - name: Stop the pull request's other runs
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-pull-request-runs
