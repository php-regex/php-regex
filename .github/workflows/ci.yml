name: CI

on:
  push:
    branches: [ 2.x ]
  pull_request:
    branches: [ 2.x ]
  schedule:
    # Every Monday: the mutation run over the parser, and every other job
    # against the week's tool releases, which no lock file pins.
    - cron: '0 4 * * 1'

concurrency:
  # The event in the key: a scheduled run on 2.x neither cancels a push's
  # run nor is cancelled by one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependency }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.6, 8.5, 8.4, 8.3, 8.2 ]
        dependency: [ prefer-lowest, prefer-stable ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pcre, tokenizer, xml
          ini-values: phar.readonly=0

      - name: Install Dependencies (${{ matrix.dependency }})
        run: |
          composer update --${{ matrix.dependency }} --prefer-dist --no-interaction

      - name: Install PHPUnit Tooling
        # On dev PHP versions, some transitive deps have not raised their PHP
        # ceiling yet (e.g. nette/schema); ignore the platform PHP requirement.
        # PHPStan too, and PHPBench whose sources its configuration scans: a
        # test analyses a fixture with the repository's own configuration.
        run: |
          composer install -d tools/phpunit --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpstan --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpbench --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}

      - name: Lower Symfony in the PHPUnit Tooling
        # The lowest Symfony the latest Laravel takes: 7.4.0, with the
        # components Laravel does not hold at 6.4.0. The tooling's PHPUnit
        # stays what this PHP runs; Symfony 6.4 with Laravel 10 is the PHP 8.1
        # job's lowest row.
        if: matrix.dependency == 'prefer-lowest'
        run: |
          composer update -d tools/phpunit --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }} 'symfony/*'

      - name: Run Test Suite
        # The whole tests/ tree, so that the functional, regression and
        # documentation tests are not left to rot outside of CI.
        run: tools/phpunit/vendor/bin/phpunit --colors=always

  tests-php81:
    # PHPUnit 12 needs PHP 8.3: PHPUnit 10.5, from tools/phpunit-81, runs the
    # suite on PHP 8.1. The lowest row runs Symfony 6.4.0, Laravel 10.37.3
    # (the first Laravel 10 that Testbench 8.18, the first with the attributes
    # the tests use, takes) and PHPUnit 10.5.0.
    name: Tests (PHP 8.1, ${{ matrix.dependency }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependency: [ prefer-lowest, prefer-stable ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, pcre, tokenizer, xml
          ini-values: phar.readonly=0

      - name: Lint for PHP 8.1
        # PHP 8.1 lints one file per call.
        shell: bash
        run: |
          find src -name '*.php' -print0 \
            | xargs -0 -n1 php -l | (grep -v '^No syntax errors detected' || true)

      - name: Install Dependencies (${{ matrix.dependency }})
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer update -d tools/phpunit-81 --${{ matrix.dependency }} --prefer-stable --no-interaction --no-progress

      - name: Smoke test
        run: php tests/Tools/php81_smoke.php --phpstan=tools/phpunit-81/vendor/bin/phpstan

      - name: Run Test Suite
        run: tools/phpunit-81/vendor/bin/phpunit -c tools/phpunit-81/phpunit.xml.dist --colors=always

  engines-bundled:
    # Patterns are judged for a PHP version and the PCRE2 it runs, and part of
    # the suite asks the running engine. The official images build PHP with the
    # PCRE2 php-src bundles, so each supported PHP runs here on its own engine;
    # the "tests" job runs them all on Ubuntu's system PCRE2.
    name: Tests (PHP ${{ matrix.php }}, bundled PCRE2 ${{ matrix.pcre }})
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', pcre: '10.40' }
          - { php: '8.3', pcre: '10.42' }
          - { php: '8.4', pcre: '10.44' }
          - { php: '8.5', pcre: '10.44' }
          # 8.6-rc is the rolling alias of the official image; it becomes plain
          # '8.6' on the 8.6 GA day (2026-11-19), when the alias disappears —
          # rename the row that day or this job breaks.
          - { php: '8.6-rc', pcre: '10.44' }

    steps:
      - name: Install Git
        # Before the checkout: without git, it downloads an archive, which
        # leaves out what .gitattributes marks export-ignore, tests included.
        run: apt-get update && apt-get install -y --no-install-recommends git unzip

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check the engine
        # An image that moves to another PCRE2 fails here, not in the suite.
        run: |
          php -r 'echo PHP_VERSION, " / PCRE2 ", PCRE_VERSION, PHP_EOL; exit(str_starts_with(PCRE_VERSION, "${{ matrix.pcre }} ") ? 0 : 1);'

      - name: Install Composer
        run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install Dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          composer install --prefer-dist --no-interaction --no-progress
          # Without --prefer-dist: tools/phpunit/composer.json installs
          # orchestra/canvas and canvas-core from git, as GitHub serves no
          # archive of some of the commits their tags name.
          # 8.6 ships no locked nette/schema release that admits it yet.
          composer install -d tools/phpunit --no-interaction --no-progress ${{ startsWith(matrix.php, '8.6') && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpstan --prefer-dist --no-interaction --no-progress ${{ startsWith(matrix.php, '8.6') && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpbench --prefer-dist --no-interaction --no-progress ${{ startsWith(matrix.php, '8.6') && '--ignore-platform-req=php+' || '' }}

      - name: Run Test Suite
        # As a plain user: a container job runs as root, who may write where
        # the tests check that nothing can.
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester --shell /bin/sh --command 'php -d phar.readonly=0 tools/phpunit/vendor/bin/phpunit --colors=always'

      - name: Prove the formatter on this engine
        # Formatted and compacted patterns must match exactly what the input
        # matches, on every engine the library supports, the 10.40 floor
        # included. Too slow for the default suite.
        run: su tester --shell /bin/sh --command 'tools/phpunit/vendor/bin/phpunit --colors=always --group formatter-corpus'

      - name: Compare the capture shapes with PHPStan
        # The type PHPStan infers for $matches next to the shape PHPRegex
        # writes, for every case of the capture shape corpus, written to
        # var/capture-shape-parity.md. It fails only when a shape refuses a
        # $matches this engine writes. Left out of the default suite.
        run: su tester --shell /bin/sh --command 'tools/phpunit/vendor/bin/phpunit --colors=always --group capture-shape-parity'

  engines-latest:
    # Every supported PHP on the latest PCRE2: on macOS, PHP links Homebrew's.
    name: Tests (PHP ${{ matrix.php }}, latest PCRE2)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.6 runs under setup-php's nightly-of-branch build until GA
        # (2026-11-19), then the same plain '8.6' serves the stable release.
        php: [ 8.6, 8.5, 8.4, 8.3, 8.2 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pcre, tokenizer, xml
          ini-values: phar.readonly=0

      - name: Show the engine
        run: |
          php -r 'echo PHP_VERSION, " / PCRE2 ", PCRE_VERSION, PHP_EOL;'

      - name: Install Dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          # Without --prefer-dist: tools/phpunit/composer.json installs
          # orchestra/canvas and canvas-core from git, as GitHub serves no
          # archive of some of the commits their tags name.
          # 8.6 ships no locked nette/schema release that admits it yet.
          composer install -d tools/phpunit --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpstan --prefer-dist --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpbench --prefer-dist --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}

      - name: Run Test Suite
        run: tools/phpunit/vendor/bin/phpunit --colors=always

  benchmarks:
    # Every benchmark subject once, each variant one revolution: a subject
    # that throws, or one that runs for minutes, fails here before anyone
    # compares numbers. No timing is asserted: shared runners are too noisy.
    name: Benchmarks (one run of each)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml

      - name: Install Dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer install -d tools/phpbench --prefer-dist --no-interaction --no-progress

      - name: Run Every Subject Once
        run: tools/phpbench/vendor/bin/phpbench run --iterations=1 --revs=1 --progress=none --stop-on-error

  coverage:
    # The suite under PCOV on one engine: line coverage must not drop below
    # the percentage in .github/coverage-threshold, raised by hand as the
    # coverage grows. The mutations run on that same coverage: those of the
    # lines a pull request or a push changes, and every Monday those of the
    # parser, each held to the scores infection.json.dist declares.
    name: Coverage and Mutations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The whole history: the changed lines are read against the base.
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml
          ini-values: phar.readonly=0
          coverage: pcov

      - name: Install Dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          # Without --prefer-dist: tools/phpunit/composer.json installs
          # orchestra/canvas and canvas-core from git, as GitHub serves no
          # archive of some of the commits their tags name.
          composer install -d tools/phpunit --no-interaction --no-progress
          composer install -d tools/phpstan --prefer-dist --no-interaction --no-progress
          composer install -d tools/phpbench --prefer-dist --no-interaction --no-progress
          composer install -d tools/infection --prefer-dist --no-interaction --no-progress

      - name: Run Test Suite with Coverage
        # The XML report and the JUnit log are what the mutation runs read
        # instead of running the suite again.
        run: >
          tools/phpunit/vendor/bin/phpunit --colors=always
          --coverage-clover var/coverage/clover.xml
          --coverage-xml var/coverage/coverage-xml
          --log-junit var/coverage/junit.xml

      - name: Check the Line Coverage
        run: php tests/Tools/check_coverage.php var/coverage/clover.xml .github/coverage-threshold

      - name: Mutate the Changed Lines
        if: github.event_name != 'schedule'
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: >
          tools/infection/vendor/bin/infection
          --coverage=var/coverage --skip-initial-tests
          --git-diff-lines --git-diff-base="$BASE"
          --ignore-msi-with-no-mutations
          --only-covering-test-cases --threads=max

      - name: Mutate the Parser
        if: github.event_name == 'schedule'
        run: >
          tools/infection/vendor/bin/infection
          --coverage=var/coverage --skip-initial-tests
          --filter=src/Parser/
          --only-covering-test-cases --threads=max

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }}, ${{ matrix.dependency }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.6, 8.5, 8.4, 8.3, 8.2 ]
        dependency: [ prefer-lowest, prefer-stable ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pcre, tokenizer, xml
          ini-values: phar.readonly=0

      - name: Install Dependencies (${{ matrix.dependency }})
        run: |
          composer update --${{ matrix.dependency }} --prefer-dist --no-interaction

      - name: Install PHPStan Tooling
        # On dev PHP versions, some transitive deps have not raised their PHP
        # ceiling yet (e.g. nette/schema); ignore the platform PHP requirement.
        run: |
          composer install -d tools/phpunit --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpstan --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}
          composer install -d tools/phpbench --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}

      - name: Run PHPStan
        run: tools/phpstan/vendor/bin/phpstan analyse

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install PHP-CS-Fixer Tooling
        run: composer install -d tools/php-cs-fixer --no-interaction --no-progress

      - name: Run PHP-CS-Fixer
        run: tools/php-cs-fixer/vendor/bin/php-cs-fixer fix --dry-run --diff

  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Rector Tooling
        run: composer install -d tools/rector --no-interaction --no-progress

      - name: Run Rector
        run: tools/rector/vendor/bin/rector process --dry-run --ansi

  phplint:
    name: PHPLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml
          ini-values: phar.readonly=0

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install PHPLint Tooling
        run: composer install -d tools/phplint --no-interaction --no-progress

      - name: Run PHPLint
        run: tools/phplint/vendor/bin/phplint

  standalone:
    # Each package as Packagist serves it: its directory alone, required in a
    # bare project, its php-regex siblings reached through path repositories
    # at the branch's version. A requirement the monorepo's root composer.json
    # hides, a sibling missing from its require or an autoload path that
    # leaves the package directory fails here, before a tag publishes it.
    name: Install ${{ matrix.package }} alone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ Parser, Explain, Optimizer, Generator, Automata, Redos, Transpiler, Linter, Toolkit, Cli, LanguageServer, PHPStan, Psalm, Rector, Symfony, Laravel ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml

      - name: Install the package in a bare project
        run: |
          project="$(mktemp -d)"
          php -r '
              $repositories = [];
              foreach (glob("src/*/composer.json") as $manifest) {
                  $repositories[] = ["type" => "path", "url" => realpath(dirname($manifest)), "options" => ["symlink" => false, "versions" => [json_decode(file_get_contents($manifest), true)["name"] => "2.x-dev"]]];
              }
              $name = json_decode(file_get_contents("src/".$argv[1]."/composer.json"), true)["name"];
              file_put_contents($argv[2]."/composer.json", json_encode(["repositories" => $repositories, "require" => [$name => "2.x-dev"], "minimum-stability" => "dev", "prefer-stable" => true], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          ' "${{ matrix.package }}" "$project"
          composer install -d "$project" --no-interaction --no-progress
          echo "project=$project" >> "$GITHUB_ENV"

      - name: Validate a pattern with what it installed
        run: |
          php -r 'require $argv[1]."/vendor/autoload.php"; exit(PHPRegex\Parser\RegexParser::create()->validate("/a+/")->isValid ? 0 : 1);' "$project"

  deptrac:
    # One layer per future package: the core depends on nothing, the
    # libraries on the core, the applications and bridges on the libraries.
    name: Deptrac
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml

      - name: Install Deptrac Tooling
        run: composer install -d tools/deptrac --no-interaction --no-progress

      - name: Run Deptrac
        run: tools/deptrac/vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress

  validation:
    name: Validation & Feature Completeness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml
          ini-values: phar.readonly=0

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Library Validation
        run: php tests/Tools/validate_library.php

      - name: Install PHPUnit Tooling
        run: composer install -d tools/phpunit --no-interaction --no-progress

      - name: Run PCRE Feature Completeness Tests
        run: tools/phpunit/vendor/bin/phpunit tests/Unit/PcreFeatureCompletenessTest.php --testdox

      - name: Run ReDoS Detection Tests
        run: tools/phpunit/vendor/bin/phpunit tests/Unit/Redos/RedosEdgeCasesTest.php --testdox

  pcre2-fixture:
    # The PCRE2 conformance fixture records what PCRE2 10.40 (the engine of the
    # oldest supported PHP) and PCRE2 10.48 (the pinned suite) do with every
    # case. Rebuild both engines from their release tarballs and re-observe the
    # committed records, so the published counts rest on real engine runs.
    name: PCRE2 Conformance Fixture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcre, tokenizer, xml

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Cache PCRE2 Builds
        id: pcre2-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pcre2
          key: pcre2test-10.40-10.48-v1

      - name: Build pcre2test 10.40 and 10.48
        if: steps.pcre2-cache.outputs.cache-hit != 'true'
        run: |
          for version in 10.40 10.48; do
            (
              mkdir -p "$RUNNER_TEMP/pcre2" && cd "$RUNNER_TEMP/pcre2"
              curl -fsSL -o "pcre2-$version.tar.gz" "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-$version/pcre2-$version.tar.gz"
              tar xzf "pcre2-$version.tar.gz"
              cd "pcre2-$version" && ./configure --disable-shared --enable-unicode && make pcre2test
            )
          done

      - name: Verify the Fixture Against Both Engines
        run: >
          php tests/Tools/verify_pcre2_fixture.php
          --floor-pcre2test="$RUNNER_TEMP/pcre2/pcre2-10.40/pcre2test"
          --pin-pcre2test="$RUNNER_TEMP/pcre2/pcre2-10.48/pcre2test"
