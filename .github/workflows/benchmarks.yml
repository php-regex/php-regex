name: Benchmarks

on:
  # A pull request starts ci.yml, which calls this workflow in its stage.
  workflow_call:
  schedule:
    # Every Monday, against the week's tool releases, which no lock file pins.
    - cron: '53 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event in the key: a scheduled run on 2.x neither cancels a manual
  # run nor is cancelled by one. The name is written out: called from
  # ci.yml, github.workflow is the caller's, and the group would be the
  # caller's own.
  group: benchmarks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    # Every benchmark subject once, each variant one revolution: a subject
    # that throws, or one that runs for minutes, fails here before anyone
    # compares numbers. No timing is asserted: shared runners are too noisy.
    name: Benchmarks (one run of each)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.4 and the project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.4'
          tools: phpbench

      - name: Run Every Subject Once
        run: tools/phpbench/vendor/bin/phpbench run --iterations=1 --revs=1 --progress=none --stop-on-error

  counted:
    # The benchmarks of tests/Benchmark/Tally, counted by Tally: the instructions,
    # cycles and memory of each case under a simulated CPU, which repeat
    # from run to run where a shared runner's time does not. So this job
    # gates: a case past its expected numbers, or a run growing faster than
    # its complexity class, fails it, and the report ends with the commands
    # that reproduce the case and accept the new numbers.
    #
    # The counts depend on the PHP build, the system libraries and the CPU
    # architecture. The cases run in the official PHP image at its digest,
    # on arm64, as `task tally` runs them on an Apple silicon host: a local
    # run counts as this job does, well inside the tolerance, so numbers
    # accepted from it pass here. A new image is new numbers, accepted
    # in the pull request that moves the digest.
    name: Benchmarks (counted)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TALLY_IMAGE: php:8.4.27-cli-trixie@sha256:d63e8b80cd4c6cfd01cfa7c910522e299cdc7ca1a2b6d6563db48df3c17e6c55

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.4 and the project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.4'
          tools: tally

      # Tally writes the job summary, annotates the benchmark files and names
      # the run whose results its accept command downloads: the container
      # reads the workspace at /app, and GITHUB_WORKSPACE says so.
      - name: Count the benchmarks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/app" --workdir /app
          --volume "$GITHUB_STEP_SUMMARY:$GITHUB_STEP_SUMMARY"
          --env GITHUB_ACTIONS --env GITHUB_STEP_SUMMARY --env GITHUB_RUN_ID --env GITHUB_REPOSITORY
          --env GITHUB_WORKSPACE=/app
          "$TALLY_IMAGE" php tools/tally/vendor/bin/tally run --output=tmp/tally

      # The accept command of the report downloads the artifacts named
      # tally-* of the run.
      - name: Keep the counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tally-results
          path: tmp/tally
          retention-days: 30
