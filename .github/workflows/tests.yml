name: Tests

# The suite on every PHP the library supports, 8.1 through 8.6, with the
# lowest and the latest dependencies, and on the next PHP as an experiment.

on:
  push:
    branches: [ 2.x ]
  pull_request:
    branches: [ 2.x ]
  schedule:
    # Every Monday, against the week's tool releases, which no lock file pins.
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event in the key: a scheduled run on 2.x neither cancels a push's
  # run nor is cancelled by one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Linux on every PHP and both dependency floors; Windows on every PHP
    # with the stable dependencies, the floors being Composer's business,
    # not the host's; macOS on one. Every cell gates.
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependency }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php: [ '8.6', '8.5', '8.4', '8.3', '8.2', '8.1' ]
        dependency: [ prefer-lowest, prefer-stable ]
        include:
          - { os: windows-latest, php: '8.6', dependency: prefer-stable }
          - { os: windows-latest, php: '8.5', dependency: prefer-stable }
          - { os: windows-latest, php: '8.4', dependency: prefer-stable }
          - { os: windows-latest, php: '8.3', dependency: prefer-stable }
          - { os: windows-latest, php: '8.2', dependency: prefer-stable }
          - { os: windows-latest, php: '8.1', dependency: prefer-stable }
          - { os: macos-latest, php: '8.4', dependency: prefer-stable }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # PHPStan too, and PHPBench whose sources its configuration scans: a
      # test analyses a fixture with the repository's own configuration.
      - name: Setup PHP ${{ matrix.php }} and the project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: ${{ matrix.php }}
          ini-values: phar.readonly=0
          dependencies: ${{ matrix.dependency }}
          tools: phpunit phpstan phpbench

      - name: Lint for PHP 8.1
        # PHP 8.1 lints one file per call.
        if: matrix.php == '8.1'
        shell: bash
        run: |
          find src -name '*.php' -print0 \
            | xargs -0 -n1 php -l | (grep -v '^No syntax errors detected' || true)

      - name: Lower Symfony in the PHPUnit Tooling
        # The lowest Symfony the latest Laravel takes: 7.4.0, with the
        # components Laravel does not hold at 6.4.0. The tooling's PHPUnit
        # stays what this PHP runs; Symfony 6.4 with Laravel 10 is the PHP 8.1
        # row's lowest.
        if: matrix.dependency == 'prefer-lowest' && matrix.php != '8.1'
        shell: bash
        run: |
          composer update -d tools/phpunit --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }} 'symfony/*'

      - name: Lower the whole PHPUnit Tooling
        # On PHP 8.1, the floors of everything: Symfony 6.4.0, Laravel 10.37.3
        # (the first Laravel 10 that Testbench 8.18, the first with the
        # attributes the tests use, takes) and PHPUnit 10.5.0. Rector is held
        # to 2.6.3, the first release that resets the PHP version between
        # test classes; the other rows keep the bridge's own floor, 2.4.
        if: matrix.dependency == 'prefer-lowest' && matrix.php == '8.1'
        shell: bash
        run: composer update -d tools/phpunit --prefer-lowest --prefer-stable --with 'rector/rector:^2.6.3' --no-interaction --no-progress

      - name: Configure PHPUnit 10.5
        # PHP 8.1 runs PHPUnit 10.5, which refuses the two details settings
        # PHPUnit 11 brought. phpunit.xml is read before the .dist.
        if: matrix.php == '8.1'
        shell: bash
        run: sed -e '/displayDetailsOnAllIssues=/d' -e '/displayDetailsOnPhpunitDeprecations=/d' phpunit.xml.dist > phpunit.xml

      - name: Smoke test
        # The packages end to end at the floor, loaded from the sources.
        if: matrix.php == '8.1'
        shell: bash
        run: php tests/Tools/php81_smoke.php --phpstan=tools/phpunit/vendor/bin/phpstan

      - name: Run Test Suite
        # The whole tests/ tree, so that the functional, regression and
        # documentation tests are not left to rot outside of CI.
        shell: bash
        run: tools/phpunit/vendor/bin/phpunit --colors=always

  tests-experimental:
    # A watchtower, not readiness: PHP 8.7 is a moving branch and nothing is
    # promised on it yet. The cell runs with the others and never gates them:
    # a red here is a signal to read, never a broken build — an upstream
    # snapshot that stopped installing, a bridge dependency not admitting the
    # branch yet, or the known PCRE2 JIT crash (releases 10.40 through 10.49
    # and main; 8.7-dev bundles 10.44). The documented workaround for that
    # last one is the pcre.jit=0 ini, to be set the day the crash actually
    # fires — not before, or the signal goes dark. No static analysis: the
    # analyser range stops at 8.6. No coverage: no driver builds on this
    # branch.
    name: Tests (PHP 8.7, experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.7 and the project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.7'
          ini-values: phar.readonly=0
          tools: phpunit phpstan phpbench

      - name: Show the engine
        run: |
          php -r 'echo PHP_VERSION, " / PCRE2 ", PCRE_VERSION, PHP_EOL;'

      - name: Run Test Suite
        run: tools/phpunit/vendor/bin/phpunit --colors=always

  transpiler-oracle:
    # The transpiler's output run in the engines it writes for: Node's
    # RegExp, under the u and v flags, and Python's re match what
    # preg_match() matches, pattern by pattern and subject by subject. The
    # engines are pinned here, as the test skips where they are missing.
    name: Transpiler oracle (Node 24, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup PHP 8.4 and the project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.4'
          tools: phpunit

      - name: Show the engines
        run: |
          php -r 'echo PHP_VERSION, " / PCRE2 ", PCRE_VERSION, PHP_EOL;'
          node --version
          python3 --version

      - name: Run the Transpiler Oracle
        run: tools/phpunit/vendor/bin/phpunit --colors=always --group transpiler-oracle tests/Integration/Transpiler

  psalm:
    # The Psalm plugin reaches a few of Psalm's internal classes, which a
    # minor release may move: its tests run on the lowest Psalm its manifest
    # admits and on the newest release of that major, whatever the other
    # cells happen to resolve.
    name: Psalm plugin (Psalm ${{ matrix.psalm }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { psalm: 'lowest', constraint: '6.19.0' }
          - { psalm: 'newest', constraint: '^6.19' }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.4 and the project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.4'
          tools: phpunit

      - name: Install Psalm ${{ matrix.constraint }}
        env:
          PSALM: ${{ matrix.constraint }}
        run: |
          composer update -d tools/phpunit vimeo/psalm --with "vimeo/psalm:$PSALM" --with-all-dependencies --no-interaction --no-progress
          composer show -d tools/phpunit vimeo/psalm | grep '^versions'

      - name: Run the plugin tests
        run: tools/phpunit/vendor/bin/phpunit tests/Integration/Bridge/Psalm --colors=always

  validation:
    name: Validation & Feature Completeness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.4 and the project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: '8.4'
          ini-values: phar.readonly=0
          tools: phpunit

      - name: Run Library Validation
        run: php tests/Tools/validate_library.php

      - name: Run PCRE Feature Completeness Tests
        run: tools/phpunit/vendor/bin/phpunit tests/Unit/PcreFeatureCompletenessTest.php --testdox

      - name: Run ReDoS Detection Tests
        run: tools/phpunit/vendor/bin/phpunit tests/Unit/Redos/RedosEdgeCasesTest.php --testdox
