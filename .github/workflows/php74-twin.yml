name: php74 twin

on:
  # A pull request starts ci.yml, which calls this workflow in its stage.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The name is written out: called from ci.yml, github.workflow is the
  # caller's, and the group would be the caller's own.
  group: php74-twin-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # The tag of the official image PHP 8.6 runs: its release candidates
    # until its GA (2026-11-19), the release once Docker Hub serves it. The
    # "-rc" tag lives on after a GA, on the candidates of the next patch
    # release, so the stable one is taken as soon as there is one.
    name: Image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php86: ${{ steps.tags.outputs.php86 }}
    steps:
      - name: Find the tag of PHP 8.6
        id: tags
        run: |
          if docker manifest inspect php:8.6-cli > /dev/null 2>&1; then
            echo 'php86=8.6' >> "$GITHUB_OUTPUT"
          else
            echo 'php86=8.6-rc' >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: generate and analyse the twin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PHP 8.4 (toolchain)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install the toolchain
        run: |
          composer install --no-interaction --no-progress
          composer install --no-interaction --no-progress --working-dir tools/rector
          composer install --no-interaction --no-progress --working-dir tools/php-cs-fixer
          composer install --no-interaction --no-progress --working-dir tools/phpstan

      - name: Generate the twin
        run: bash build/generate.sh

      - name: Install the twin's environment
        run: composer install --no-interaction --no-progress --working-dir build/smoke

      # level max, judged as PHP 7.4 code: the bar src/Parser passes
      - name: Analyse the twin
        run: tools/phpstan/vendor/bin/phpstan analyse -c build/phpstan-php74.neon --no-progress --memory-limit=-1

      - name: Analyse the code that checks the twin
        run: tools/phpstan/vendor/bin/phpstan analyse -c build/phpstan-verify.neon --no-progress --memory-limit=-1

      - name: List the patterns the twin is compared on
        run: php build/verify/patterns.php > patterns.json

      # The jobs below check out without git, from the archive, which
      # leaves build/ out: the code that checks the twin travels here.
      - uses: actions/upload-artifact@v7
        with:
          name: twin
          path: |
            build/php74/
            build/smoke/vendor/
            build/smoke/composer.json
            build/verify/
            build/tests/
            build/phpunit.xml.dist
            patterns.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # PHP 7.4 and 8.0 are older than the original runs on: their twin is
  # compared to the original on the oldest PHP it serves
  reference:
    name: the original's readings on PHP 8.1
    needs: generate
    runs-on: ubuntu-latest
    container: php:8.1-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: twin

      - name: Read every pattern with the original
        run: |
          mkdir -p reference
          cp patterns.json reference/
          for i in 0 1 2 3; do
            php -d memory_limit=2G build/verify/run-witness.php build/verify/original-autoload.php reference/patterns.json "$i/4" --hash > "reference/witnesses-$i.jsonl" &
          done
          wait
          php build/verify/api.php build/verify/original-autoload.php src/Parser > reference/api.json

      - uses: actions/upload-artifact@v7
        with:
          name: reference-8.1
          path: reference/
          if-no-files-found: error
          retention-days: 7

  # each PHP the original runs on: the original and the twin read every
  # pattern on the same engine, and every reading must be the same
  twin:
    name: twin on PHP ${{ matrix.php }}
    needs: [ generate, images ]
    runs-on: ubuntu-latest
    container: php:${{ matrix.php == '8.6' && needs.images.outputs.php86 || matrix.php }}-cli
    strategy:
      fail-fast: false
      # Three of the six cells at once: the matrices of one pull request
      # hold a third of the organization's sixty runners at most.
      max-parallel: 3
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    steps:
      - name: Install multibyte support
        # an image without mbstring, as the candidates of 8.6 ship, compiles
        # it, which the original and PHPUnit read, with oniguruma; an image
        # that has it skips the rest
        run: |
          if php -r 'exit(extension_loaded("mbstring") ? 0 : 1);'; then exit 0; fi
          apt-get update && apt-get install -y --no-install-recommends libonig-dev
          docker-php-ext-install mbstring

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: twin

      - name: Read every pattern with the original
        run: |
          mkdir -p reference
          cp patterns.json reference/
          for i in 0 1 2 3; do
            php -d memory_limit=2G build/verify/run-witness.php build/verify/original-autoload.php reference/patterns.json "$i/4" --hash > "reference/witnesses-$i.jsonl" &
          done
          wait
          php build/verify/api.php build/verify/original-autoload.php src/Parser > reference/api.json

      - name: Run the twin's suite
        env:
          TWIN_REFERENCE: reference
        run: php -d memory_limit=2G build/smoke/vendor/bin/phpunit -c build/phpunit.xml.dist

  twin-below-the-original:
    name: twin on PHP ${{ matrix.php }}
    needs: reference
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: twin

      - uses: actions/download-artifact@v8
        with:
          name: reference-8.1
          path: reference

      - name: Run the twin's suite
        env:
          TWIN_REFERENCE: reference
        run: php -d memory_limit=2G build/smoke/vendor/bin/phpunit -c build/phpunit.xml.dist

  # Release: publish the verified tree to the mirror repository
  # php-regex/regex-parser-php74 under the triggering tag. A manual gesture
  # until then: the tree to publish is the "twin" artifact of a green run.
