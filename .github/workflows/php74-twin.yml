  #   if: startsWith(github.ref, 'refs/tags/')
  #   needs: twin
  #   steps:
  #     - ... regenerate, gate again, rewrite composer.json (name +
  #       php ^7.4 || ^8.0 + symfony/polyfill-*), push to the mirror
